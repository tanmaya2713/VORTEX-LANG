name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: android
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o bin/vortex-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./cmd/vortex
      - name: Package
        shell: bash
        run: |
          cd bin
          zip ../vortex-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            vortex-${{ matrix.goos }}-${{ matrix.goarch }}*
      - uses: softprops/action-gh-release@v2
        with:
          files: vortex-*.zip
